name: Import VEYRA v1.0.0 exact release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned VEYRA release
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             https://github.com/amirmushichge/veyra-interactive-car/archive/refs/tags/v1.0.0.zip             -o /tmp/veyra-v1.0.0.zip
          rm -rf /tmp/veyra-release
          mkdir -p /tmp/veyra-release
          unzip -q /tmp/veyra-v1.0.0.zip -d /tmp/veyra-release
          SRC="$(find /tmp/veyra-release -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          test -f "$SRC/package.json"
          test -f "$SRC/reference-manifest.json"

      - name: Replace adaptation with exact pinned release
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find /tmp/veyra-release -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .

      - name: Verify exact source tree before commit
        shell: bash
        run: |
          set -euo pipefail
          test -f src/App.tsx
          test -f src/HoverVideo.tsx
          test -f src/AppearanceMenu.tsx
          test -f src/index.css
          test -f public/media/exterior-polished.png
          test -f public/media/hood-hover-forward.mp4
          test -f public/media/battery-hover-forward.mp4
          test -f docs/VERIFICATION.md
          test -f reference-manifest.json

      - name: Commit exact release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import exact VEYRA v1.0.0 release"
            git push origin HEAD:main
          fi
