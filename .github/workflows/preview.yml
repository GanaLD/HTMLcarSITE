name: Build preview branch

on:
  push:
    branches: [preview-build]

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:reference
      - run: pnpm exec tsc -b
      - run: pnpm exec vite build --base=./

      - name: Adapt only preview asset URLs for subpath hosting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in Path('dist/assets').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('"/media/', '"./media/')
              text = text.replace("'/media/", "'./media/")
              path.write_text(text, encoding='utf-8')
          PY

      - name: Publish static preview branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/veyra-preview
          mkdir -p /tmp/veyra-preview
          cp -a dist/. /tmp/veyra-preview/
          touch /tmp/veyra-preview/.nojekyll
          cd /tmp/veyra-preview
          git init
          git checkout -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build VEYRA preview"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin preview
